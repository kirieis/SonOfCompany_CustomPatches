## Volume multiplier on AUTHORED weapon clips only â€” the bundled fire and reload takes. The vanilla shotgun clips that still fill the unauthored slots (dry fire, safety) are already mixed against the game and are deliberately left alone, so raising this does not drift them out of balance. The pack's samples sit quieter than Lethal Company's, which is what this corrects. Above ~2 the louder transients start to clip.
# Setting type: Single
# Default value: 1.6
Authored Audio Gain = 1.6

## Stop native Y4NGZ weapons firing vanilla's ShootShotgun/ReloadShotgun/SwitchGunSafety animator parameters into a player body the animation API currently owns. Required by the runtime wiring contract: never fire fallback vanilla triggers into an externally owned custom controller. When no Y4NGZ interaction is active the vanilla triggers still play, because no authored body animation exists to replace them yet (#96).
# Setting type: Boolean
# Default value: true
Native Suppress Vanilla Body Triggers = true

## Seconds without a shot or reload before a third-person holder lowers the weapon to its rest pose; the next shot, reload or re-equip raises it. Third person only (other players, and your own body under a third-person camera); first-person arms never lower. Every client decides this from the shots and reloads it already sees, so nothing extra is sent. 0 turns the rest pose off. Weapons whose third-person pack has no rest state yet simply stay raised.
# Setting type: Single
# Default value: 4
Third Person Rest Delay Seconds = 4

## Diagnostic-only (#111): collapse every native weapon's spread cone to zero so the aim probe measures the shot RAY instead of the pattern drawn around it, making its pass criteria geometric identities rather than statistics. This CHANGES BALLISTICS while it is on â€” in multiplayer, leave it to the host or expect the shooter and everyone else to disagree about where a shot went. Read the 'AIM VERDICT' line in the log. Off by default.
# Setting type: Boolean
# Default value: false
Aim Probe Zero Spread = false

## Play authored-first per-material bullet-impact audio where a round lands, with Lethal Company's footstepSurfaces[i].hitSurfaceSFX as the safe material fallback (#118). Unknown or clipless surfaces use the authored General pool when available. Creature hits are NOT played here: EnemyType.hitBodySFX already fires inside IHittable.Hit.
# Setting type: Boolean
# Default value: true
Impact Audio Enabled = true

## Volume of authored-first per-surface bullet impacts and their vanilla fallback. Default 0.75; live mix verdict still pending (#118).
# Setting type: Single
# Default value: 0.75
Impact Audio Volume = 0.75

## Escape hatch (#116): restore the pre-2026-08-02 enemy damage cast â€” a 5 metre sphere swept from 10 m BEHIND the shooter along the un-spread aim vector, out to 25 m. That shape damaged every enemy in a roughly 10 m wide, 35 m long capsule regardless of where the bullet actually went, which made the crosshair and the whole accuracy model decorative for damage. Native weapons now resolve enemies per pellet, on the pellet's own direction, within 'EnemyCastRadiusMeters' and no further than the pellet actually travelled. Turn this on only to A/B the old feel; it cannot be right, only familiar.
# Setting type: Boolean
# Default value: false
Legacy Enemy Spherecast = false

## Make flesh and insectoid creatures bleed where a bullet lands (#120), using the optional Y4NGZBloodFX plugin's blood system â€” the same bursts, splatter and decal budget that player blood uses, so the '08 - Blood FX' section of com.y4ngz.bloodfx.cfg governs how much of it there is. Robots spark instead and never bleed; ghosts and unclassified creatures draw nothing. Y4NGZBloodFX is NOT a dependency: without it installed, creature hits simply draw no blood. Turning Blood FX off there turns this off with it; this switch exists to judge creature blood separately from player blood.
# Setting type: Boolean
# Default value: true
Creature Blood = true

## How big a creature blood burst is, as a multiplier on the authored size (#147). 1.0 is the size every blood burst has been since the system shipped â€” and that size was authored for a PLAYER wound seen at melee range, never judged on a creature at shooting distance. Raise this if wounds read too small. Per-weapon spread is applied on top: small caliber 1.0, rifle rounds 1.45, shotgun 1.7, grenades 2.2. This scales the burst's SIZE; '[08 - Blood FX] Intensity' in com.y4ngz.bloodfx.cfg scales its particle COUNT, which is a different question.
# Setting type: Single
# Default value: 1
Creature Blood Burst Scale = 1

## Colour that flesh creatures bleed, as 'r,g,b' from 0 to 1. LEAVE EMPTY for the authored red â€” the blood assets are already red and their textures are greyscale masks, so an empty value draws the shipped look untouched rather than tinting red over red. Set a value only to push human/animal blood somewhere else deliberately.
# Setting type: String
# Default value: 
Flesh Blood Tint = 

## Colour that insectoid creatures bleed (spiders, centipedes, bees, hoarding bugs), as 'r,g,b' from 0 to 1. Empty falls back to this same green. The decal masks are authored for red, so a strongly shifted hue can read muddy â€” if one does, the fix is a dedicated asset rather than a further push on this number.
# Setting type: String
# Default value: 0.32,0.44,0.06
Insect Blood Tint = 0.32,0.44,0.06

## Diagnostic-only: spawns the muzzle flash unparented 1.5 m in front of the camera and reports it, separating 'the effect does not render' from 'the effect is mounted where you cannot see it'. Requires VFX Diagnostics. Use Unity InputSystem Key names; empty disables.
# Setting type: String
# Default value: F9
VFX Isolation Test Key = F9

[World Feedback]

## Enable Better Armory's global client-side interaction, scrap, near miss, and scan feedback. This affects ordinary gameplay even when no weapon is held and the Y4NGZ Upgrades menu is closed.
# Setting type: Boolean
# Default value: true
Enabled = true

## Replace the vanilla interaction icon with a small centre cue inside the weapon crosshair while a Better Armory weapon or vanilla shotgun is held and a pickup or interactable is targeted. With anything else in hand the vanilla icon shows as normal. Turn this off to keep the vanilla icon while holding weapons too.
# Setting type: Boolean
# Default value: true
Interaction Reticle Enabled = true

