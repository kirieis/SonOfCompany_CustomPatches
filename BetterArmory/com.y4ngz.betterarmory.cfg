Interior Spawn Rarity = 8

## Value a copy of this weapon rolls when it spawns as interior loot, shown on its scan label. The Company counter pays it only for weapons that are scrap; shop weapons such as the Revolver, Heavy Shotgun and Bolt-Action Rifle sell for nothing. Applied when the item is built, so it takes a restart, and read on the host when a spawned instance rolls its value.
# Setting type: Int32
# Default value: 140
Scrap Value = 140

