# Default value: true
Camera Residue Janitor = true

## Global multiplier on every Better Armory weapon's camera kick (feel only; spread and bloom do not change). 0 turns the kick off. Read on every shot.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
Recoil Strength = 1

## Enable the Heavy Shotgun first-person arms and animated prop interaction.
# Setting type: Boolean
# Default value: true
Heavy Shotgun FP Animation = true

## Re-anchor the first-person Heavy Shotgun left-hand IK target to the actual gun prop pose each frame.
# Setting type: Boolean
# Default value: true
FP Left Hand Gun Anchor = true

## First-person Heavy Shotgun prop local position delta 'x,y,z' in meters. Re-read on each interaction start.
# Setting type: String
# Default value: 0,0,0
FP Prop Pos Delta = 0,0,0

## First-person Heavy Shotgun prop local euler rotation delta 'x,y,z' in degrees. Re-read on each interaction start.
# Setting type: String
# Default value: 0,0,0
FP Prop Rot Delta = 0,0,0

## First-person Heavy Shotgun prop local scale multiplier. Re-read on each interaction start.
# Setting type: Single
# Default value: 1
FP Prop Scale Mult = 1

## Diagnostic-only: report what the weapon fire path DID â€” which ItemActivate branch ran, the resolved muzzle position, which bundle the flash prefab came from, and each particle renderer's mesh/material/shader. One line per event per session, never per shot. Off by default; enable only when chasing a missing effect.
# Setting type: Boolean
# Default value: false
VFX Diagnostics = false

## Diagnostic-only: log the live first-person finger, fingertip, and thumb curl deltas every two seconds while a weapon is held. Off by default; enable only when tuning the hand pose.
# Setting type: Boolean
# Default value: false
Finger Curl Diagnostics = false

## Uniform scale on the muzzle flash effect. The RVFX effects are authored at rifle proportions (5-30 cm particles); raise this if a pistol flash reads too small. 0 hides the flash, and the vanilla flare with it. Look tuning, no in-game verdict yet.
# Setting type: Single
# Default value: 1
Muzzle Flash Scale = 1

## Also play the vanilla shotgun's flame flare and muzzle light at Better Armory firearm muzzles (#680). Off shows only Better Armory's own flash.
# Setting type: Boolean
# Default value: true
Vanilla Muzzle Flare = true

## Size of the vanilla shotgun's flame flare overlay only, on top of Muzzle Flash Scale and each weapon's own flare size (#680). 0 hides the flare; Better Armory's own flash is unaffected. Look tuning.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
Vanilla Flare Scale = 1

## Brightness of the dynamic point light the vanilla flare overlay casts, as a multiplier on vanilla's own (#680). 0 turns the light off and keeps the flame sprite. Look tuning.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
Vanilla Flare Light = 1

## Uniform scale on the surface impact burst (dust and debris) spawned where a native weapon's shot lands. Authored at rifle proportions in the same RVFX pack as the muzzle flash. Look tuning, no in-game verdict yet.
# Setting type: Single
# Default value: 1
Impact Burst Scale = 1

## Place fading RVFX mesh-quad bullet holes on world surfaces hit by native Y4NGZ weapons (#85). Players, creatures, and held items are excluded by the shared impact-surface guard.
# Setting type: Boolean
# Default value: true
Bullet Hole Decals = true

## Uniform size multiplier on bullet-hole mesh quads. Clamped to 0.1-5.0; 1.0 is the RVFX authored size and remains unverified in game.
# Setting type: Single
# Default value: 1
Bullet Hole Decal Scale = 1

## Seconds a bullet hole remains alive, including its fade. Clamped to 5-120 seconds; lowered from 45 to 15 (#180) because sustained automatic fire saturated the cap with overlapping quads.
# Setting type: Single
# Default value: 15
Bullet Hole Decal Lifetime = 15

## Seconds at the end of each bullet hole's lifetime spent fading through a MaterialPropertyBlock. Clamped between zero and the configured lifetime; creates no material instances. Lowered from 10 to 2 (#180): a fading decal is excluded from the SRP Batcher, so long fades made every live decal its own draw call.
# Setting type: Single
# Default value: 2
Bullet Hole Decal Fade Seconds = 2

## Global Upgrades-owned bullet-hole cap across every player. Oldest marks retire first; clamped to 8-256 and deliberately separate from the Y4NGZBloodFX blood-decal budget.
# Setting type: Int32
# Default value: 32
Bullet Hole Decal Max Live = 32

## Draw the fading marks that melee weapons and the vanilla shovel leave on walls and floors (#722). Marks share the bullet-hole lifetime, fade, cap and scale and only stick to static world surfaces; off hides them on this machine only.
# Setting type: Boolean
# Default value: true
Melee Marks Enabled = true

## Let the vanilla shovel leave a burst and a surface mark where it hits walls and floors (#722). Marks share the bullet-hole lifetime, fade, cap and scale and only stick to static world surfaces; off, this machine's shovel adds nothing and ignores other players' shovel marks.
# Setting type: Boolean
# Default value: true
Vanilla Shovel Marks = true

