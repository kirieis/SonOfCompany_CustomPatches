## Damage dealt to CREATURES at point-blank range, falling off linearly to 'Enemy Damage Far' at the weapon's maximum range. This is Lethal Company's own enemy damage scale, NOT player health: most creatures have between 1 and 10 hit points (a Bracken has 5, a Hoarding Bug 3, a Thumper 6) and a shovel hits for 1, so 1 to 3 is the normal range for a weapon here and small changes are large balance changes. On a weapon that fires a pattern this is PER PELLET - the Heavy Shotgun's ten pellets each apply this value at their own distance. The 'Enemy Force Cap' keys below then limit what one shot lands on one creature. Zero means the weapon does not damage creatures at all. HOST-AUTHORITATIVE: enemy damage is resolved on the server, so the host's value is the one that lands.
