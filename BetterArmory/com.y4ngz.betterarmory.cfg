[Crosshair]

## Size the weapon crosshair from the cone the weapon would actually fire right now â€” its spread plus movement, stance, fire and recoil bloom â€” projected through the live camera FOV. Shotgun brackets draw at a third of their pattern so they stay a compact reticle rather than a frame around the view. Off falls back to the old fixed 16-24 px gap for every weapon except the shotgun bracket, which keeps its resolution-relative fixed size.
# Setting type: Boolean
# Default value: true
Accuracy Sizing = true

## Only size the crosshair from spread when that spread reaches a bullet. The cloned first-generation weapons fire through vanilla ShootGun, which applies NO spread at all, so their authored cone is decoration â€” with this on they draw a fixed per-family size instead of a number nothing consumes. Each weapon stops being cosmetic as it migrates to the native base (#117). Turn off to let those weapons bloom cosmetically anyway.
# Setting type: Boolean
# Default value: true
Honest Sizing Only = true

## How the vanilla centre interaction icon coexists with Better Armory's target cue while a Better Armory weapon or vanilla shotgun is held. Hide replaces it only while that cue is active, Fade keeps it enabled at zero alpha for compatibility, and Show leaves both visible. With no such weapon held, or with the Interaction Reticle disabled, the vanilla icon is never touched.
# Setting type: VanillaCursorIconMode
# Default value: Hide
# Acceptable values: Hide, Fade, Show
Vanilla Cursor Icon = Hide

