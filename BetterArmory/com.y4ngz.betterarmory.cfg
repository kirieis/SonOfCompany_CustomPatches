[Late Game Upgrades]

## Apply your Late Game Upgrades Hollow Point, Long Barrel, Sleight of Hand and Silver Bullets ranks to Better Armory firearms (the Flamethrower is not a firearm), and your Bullet Resistance to Better Armory and blacksite soldier gunshots that hit you. Your own value gates your range, reload speed, resistance and terminal text. The host's value also decides whether anyone's extra damage, longer damage range and Ghost Girl kills are applied. Does nothing without Late Game Upgrades.
# Setting type: Boolean
# Default value: true
Apply Firearm Upgrades = true

## Hollow Point raises firearm enemy damage in proportion to its bonus on the vanilla shotgun's close-range hit (+1 on 5 is +20%). Pellet damage is rounded fairly so the average matches. The host's value can refuse the extra damage for everyone.
# Setting type: Boolean
# Default value: true
Hollow Point = true

## Long Barrel lengthens firearm range and stretches the damage falloff by the same percentage. Friendly-fire range is unchanged, as on the vanilla shotgun. The host's value can refuse the longer damage range for everyone; the shot then still travels further but only damages creatures within the normal range.
# Setting type: Boolean
# Default value: true
Long Barrel = true

## Sleight of Hand shortens firearm reloads by Late Game Upgrades' own reload-time scale (12.5% per 25% advertised). Reload sounds for everyone follow the shorter reload.
# Setting type: Boolean
# Default value: true
Sleight of Hand = true

## Silver Bullets lets your firearm kill a Ghost Girl it hits. The host carries out the kill, so the host's value can refuse it for everyone.
# Setting type: Boolean
# Default value: true
Silver Bullets = true

## Reword these four upgrades in the Late Game Upgrades terminal so they say firearm instead of shotgun. Applies when the terminal store is built, so change it before loading a save.
# Setting type: Boolean
# Default value: true
Rename Terminal Text = true

