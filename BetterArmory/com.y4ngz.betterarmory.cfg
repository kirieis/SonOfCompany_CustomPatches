# Default value: 3
# Acceptable value range: From 1 to 50
Enemy Force Cap Mid = 3

## Same cap when the nearest pellet hit is 6 m or more away (vanilla shotgun: 2), on the sum of all pellets that hit that creature; player damage is not affected. HOST-AUTHORITATIVE.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 50
Enemy Force Cap Far = 2

