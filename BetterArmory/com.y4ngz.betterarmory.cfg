# Setting type: Single
# Default value: 1.16
Weight = 1.16

## Whether carrying this weapon occupies both hands, which blocks the sprint, ladder and second-item interactions a one-handed item allows. Applied when the item is built, so it takes a restart. Evaluated per machine: every player in a lobby must use the same value.
# Setting type: Boolean
# Default value: true
Two Handed = true

## Whether the player's third-person carry pose uses the two-handed hold. Applied when the item is built, so it takes a restart, and every player in a lobby must use the same value. CAUTION: this is a pose, not a rule - setting it against what the weapon's authored hold was built for makes the model sit wrong in other players' hands even though it looks correct in your own.
# Setting type: Boolean
# Default value: true
Two Handed Animation = true

## Damage dealt to CREATURES at point-blank range, falling off linearly to 'Enemy Damage Far' at the weapon's maximum range. This is Lethal Company's own enemy damage scale, NOT player health: most creatures have between 1 and 10 hit points (a Bracken has 5, a Hoarding Bug 3, a Thumper 6) and a shovel hits for 1, so 1 to 3 is the normal range for a weapon here and small changes are large balance changes. On a weapon that fires a pattern this is PER PELLET - the Heavy Shotgun's ten pellets each apply this value at their own distance. Zero means the weapon does not damage creatures at all. HOST-AUTHORITATIVE: enemy damage is resolved on the server, so the host's value is the one that lands.
# Setting type: Int32
# Default value: 1
Enemy Damage Near = 1

## Damage dealt to CREATURES at maximum range, on the same 1-to-10 enemy scale as 'Enemy Damage Near' and per pellet in the same way. HOST-AUTHORITATIVE.
# Setting type: Int32
# Default value: 1
Enemy Damage Far = 1

## Friendly-fire damage dealt to PLAYERS at point-blank range, falling off linearly to 'Player Damage Far' at the weapon's maximum range. This is player health, where a player has 100 - so it is a completely different scale from the 'Enemy Damage' pair above and must not be tuned against it. Applied once per shot rather than per pellet. Resolved on the victim's own machine.
# Setting type: Int32
# Default value: 28
Player Damage Near = 28

## Friendly-fire damage dealt to PLAYERS at maximum range, out of 100 player health. Same scale as 'Player Damage Near'.
# Setting type: Int32
# Default value: 18
Player Damage Far = 18

## Rounds the weapon holds when full. Read locally by every player's reload, HUD and save/load path, so this MUST MATCH across a lobby - a mismatch makes two players disagree about when the gun is empty.
# Setting type: Int32
# Default value: 30
Magazine Size = 30

## Multiplier on the weapon's rate of fire. 2.0 doubles the RPM component, 0.5 halves it. Applied to the authored rounds-per-minute (or, on a weapon that has none, to its shot cooldown). Mechanical cycles remain a minimum time between shots. Evaluated locally: keep it identical across a lobby.
# Setting type: Single
# Default value: 1
Fire Cadence Multiplier = 1

## Multiplier on the weapon's base spread cone, before the movement, stance, shot and recoil bloom terms. Below 1 tightens the pattern. The crosshair is sized from the same number, so it follows automatically. Pellets are resolved on the shooter's machine.
# Setting type: Single
# Default value: 1
Spread Multiplier = 1

## Multiplier on this weapon's camera kick, on top of '[Weapons] Recoil Strength'. Camera feel only: the spread cone and its recoil bloom do not change, whatever this is set to. 0 = no kick. Applied at startup, so it takes a restart.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
Recoil Multiplier = 1

